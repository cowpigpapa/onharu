<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONHARU 화면 디자인 비교 목업</title>
<style>
  :root{--ink:#172033;--muted:#68758a;--line:#dce3ec;--paper:#f5f7fb;--surface:#fff;--brand:#4f46e5;--sky:#0369a1;--violet:#6d28d9;--peach:#fbe8de;--mint:#ddf3f1;--rose:#fff1f2;--shadow:0 18px 54px #29344b24}
  *{box-sizing:border-box} body{margin:0;color:var(--ink);font:13px/1.45 "Malgun Gothic","Segoe UI",sans-serif;background:#e9edf4}
  button{font:inherit;color:inherit}.top{position:sticky;z-index:20;top:0;padding:18px 24px 14px;background:#f7f9fceF;backdrop-filter:blur(14px);border-bottom:1px solid #d8dee8}
  h1{margin:0 0 4px;font-size:20px}.lead{margin:0;color:var(--muted)}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.nav button,.variants button{border:1px solid #cad3e0;background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer}.nav button.on,.variants button.on{color:#fff;background:#334155;border-color:#334155}
  main{max-width:1320px;margin:auto;padding:24px}.variants{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.variants button{display:grid;text-align:left;min-width:160px}.variants small{color:#78869a}.variants button.on small{color:#dbe4f0}
  .stage{background:#dfe5ed;border:1px solid #cbd4df;border-radius:22px;padding:28px;min-height:690px;display:grid;place-items:center}#preview{width:100%;display:grid;place-items:center}
  .window{width:min(1120px,100%);height:620px;background:var(--paper);border:1px solid #aeb4c0;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
  .titlebar{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;background:#e9edf3;border-bottom:1px solid #d4dae3}.titlebar b{font-size:19px}.glyph{width:24px;height:24px;display:grid;place-items:center;font-size:20px}.spacer{flex:1}.icon{border:0;background:transparent;width:30px;height:30px;border-radius:9px;cursor:pointer}.icon:hover{outline:1px solid #ccd4df}.body{min-height:0;flex:1;display:flex;padding:12px;gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}.btn{height:30px;padding:0 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.primary{color:#fff;border:0;background:linear-gradient(110deg,var(--sky),var(--brand))}.seg{display:flex;padding:2px;border:1px solid #c4b5fd;border-radius:10px;background:#fff}.seg span{padding:5px 11px;border-radius:8px}.seg .on{background:#ede9fe;color:var(--violet);font-weight:700}
  .calendar{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;overflow:hidden}.day{position:relative;padding:6px;border-right:1px solid #e2e7ef;border-bottom:1px solid #e2e7ef;min-width:0}.day:nth-child(7n){border-right:0}.num{font-weight:700}.event{display:block;margin-top:4px;padding:3px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.blue{background:#dceafe;color:#174a82}.pink{background:#fbe4ec;color:#8e294c}.green{background:#dff3e6;color:#24643d}.gold{background:#f9edc9;color:#76540c}.violet{background:#eee5fb;color:#5b2a86}
  .main-head{height:82px;padding:12px 16px;display:flex;align-items:center;gap:12px}.brand{font-size:17px;font-weight:800;background:linear-gradient(90deg,#0284c7,#7c3aed);color:transparent;background-clip:text}.main-layout{display:grid;grid-template-columns:1fr 280px;gap:12px;min-height:0;flex:1}.main-cal{display:grid;grid-template-rows:30px 1fr;min-width:0}.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--muted);font-size:11px}.detail{padding:12px;overflow:hidden}.detail h3{margin:0 0 10px}.detail-item{padding:9px;margin-bottom:8px;border-radius:10px}.toolrow{display:flex;gap:7px;align-items:center}
  .search-layout{display:grid;grid-template-rows:auto auto 1fr;gap:10px;width:100%}.input{height:34px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:8px 10px}.search-meta{display:flex;align-items:end;gap:10px}.results{overflow:hidden}.result{height:48px;padding:7px;display:grid;grid-template-columns:74px 1fr auto;align-items:center;border-bottom:1px solid #edf0f4}.result:last-child{border:0}.result time{color:var(--muted)}
  .table-wrap{width:100%;overflow:hidden}.tt{width:100%;height:100%;border-collapse:collapse}.tt th,.tt td{border:1px solid #dde3ec;padding:9px;text-align:center}.tt th{height:38px;background:#f4f6fa}.tt td:first-child{width:92px;background:#f7f8fb;color:var(--muted)}
  .alarm{width:min(560px,100%)}.alarm .body{display:grid;grid-template-rows:auto auto 1fr}.alarm-entry{padding:16px;display:flex;gap:10px;align-items:center}.alarm-list{overflow:hidden;padding:8px}.alarm-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #edf0f4}
  .kbo .body{display:grid;grid-template-rows:auto 1fr auto}.kbo-toolbar{display:flex;gap:8px;align-items:center}.kbo-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;overflow:hidden}.game{margin-top:4px;padding:3px;background:#e2f1e7;color:#235c37;border-radius:5px;font-size:10px}.footer{display:flex;align-items:center;gap:8px;padding:10px}
  .notes{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-top:14px}.note{background:#fff;border:1px solid #d4dce7;border-radius:12px;padding:13px}.note h3{font-size:13px;margin:0 0 5px}.note p{margin:0;color:#64748b;font-size:12px}.recommend{border-color:#8b83e8;box-shadow:inset 0 0 0 1px #8b83e8}.badge{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:20px;background:#ede9fe;color:#5b21b6;font-size:10px}
  /* A: quiet ledger — denser, squared, strong rows */
  .v-a .window{border-radius:10px}.v-a .card{border-radius:7px}.v-a .body{gap:8px}.v-a .event,.v-a .game{border-radius:3px}.v-a .detail-item{border-left:4px solid currentColor;border-radius:4px}.v-a .result{height:42px}.v-a .titlebar{background:#f1f4f8}
  /* B: focus rail — tools become a distinct side rail */
  .v-b .window{background:#f4f1fb}.v-b .titlebar{background:#fff}.v-b .body{padding-left:76px;position:relative}.v-b .body:before{content:"⌕\A▦\A◴\A⚾\A⚙";white-space:pre;position:absolute;left:12px;top:12px;width:50px;height:calc(100% - 24px);padding-top:12px;text-align:center;font:20px/2.3 "Segoe UI Symbol";background:#252b3b;color:#fff;border-radius:14px}.v-b .main-head .toolrow{display:none}.v-b .main-layout{grid-template-columns:1fr 250px}.v-b .card{border-color:#d8d1eb}
  /* C: soft cards — stronger grouping and breathing room */
  .v-c .window{background:#eef4f6;border-radius:22px}.v-c .titlebar{background:#e4eef2;height:66px}.v-c .body{padding:18px;gap:16px}.v-c .card{border:0;border-radius:17px;box-shadow:0 7px 20px #41566b14}.v-c .day{margin:3px;border:0!important;border-radius:9px;background:#fff}.v-c .calendar,.v-c .kbo-grid{gap:3px}.v-c .result{margin:5px 7px;border:0;border-radius:10px;background:#f7f9fb}.v-c .tt{border-collapse:separate;border-spacing:4px}.v-c .tt th,.v-c .tt td{border:0;border-radius:8px}.v-c .alarm-row{margin-bottom:6px;border:0;border-radius:10px;background:#f7f9fb}
  @media(max-width:800px){main{padding:12px}.stage{padding:10px}.notes{grid-template-columns:1fr}.main-layout{grid-template-columns:1fr}.detail{display:none}.window{height:600px}.v-b .body{padding-left:64px}.variants button{min-width:140px}}
</style>
</head>
<body>
<header class="top"><h1>ONHARU 화면 디자인 비교 목업</h1><p class="lead">현재 구현과 구조적 성격이 다른 3개 대안입니다. 탭을 눌러 화면과 시안을 바꿔 보세요.</p><nav class="nav" id="screens"></nav></header>
<main><div class="variants" id="variants"></div><section class="stage"><div id="preview"></div></section><section class="notes" id="notes"></section></main>
<script>
const screens=[['main','메인 달력'],['search','검색'],['timetable','시간표'],['alarm','알람'],['kbo','KBO']];
const variants=[
 ['current','현재안','현재 WPF 구조'],['a','A · 조용한 장부','밀도·선 정렬 중심'],['b','B · 집중 레일','도구와 콘텐츠 분리'],['c','C · 소프트 카드','그룹·여백 중심']
];
const notes={
 current:['장점','현재 기능과 학습 비용을 그대로 유지합니다.','단점','화면별 누적 수정으로 조작 위계가 다소 분산돼 있습니다.'],
 a:['장점','일정과 표를 가장 많이 보여주며 기준선이 또렷합니다.','단점','부드러운 ONHARU 인상이 조금 약해질 수 있습니다.'],
 b:['장점','부가기능 진입점이 한곳에 모여 본문 집중도가 높습니다.','단점','현재 헤더 구조와 차이가 커 적용 범위와 학습 비용이 큽니다.'],
 c:['장점','정보 묶음이 빠르게 읽히고 파스텔 성격이 가장 선명합니다.','단점','같은 크기에서 표시 가능한 일정 수가 줄어듭니다.']
};
const days=Array.from({length:35},(_,i)=>{const n=i+1;let e='';if([2,8,15,22].includes(n))e='<span class="event blue">09:30 팀 미팅</span>';if([5,19].includes(n))e='<span class="event pink">기념일 준비</span>';if([11,25].includes(n))e='<span class="event green">⚾ KBO 경기</span>';return `<div class="day"><span class="num">${n}</span>${e}</div>`}).join('');
const heading=(glyph,title,extra='')=>`<div class="titlebar"><span class="glyph">${glyph}</span><b>${title}</b><span class="spacer"></span>${extra}<button class="icon">×</button></div>`;
function main(){return `<div class="window"><div class="main-head"><span class="brand">온하루 · ONHARU</span><button class="icon">‹</button><b>2026년 9월</b><button class="icon">›</button><span class="spacer"></span><div class="toolrow"><button class="icon">⌕</button><button class="icon">▦</button><button class="icon">◴</button><button class="icon">⚾</button><button class="icon">⚙</button></div></div><div class="body main-layout"><section class="card main-cal"><div class="week"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div><div class="calendar">${days}</div></section><aside class="card detail"><h3>9월 2일 수요일</h3><div class="detail-item blue"><b>팀 프로젝트 회의</b><br><small>09:30 · 업무</small></div><div class="detail-item pink"><b>부모님과 저녁</b><br><small>19:00 · 개인</small></div><div class="detail-item gold"><b>D-18 발표</b><br><small>하루 종일</small></div></aside></div></div>`}
function search(){return `<div class="window">${heading('⌕','검색')}<div class="body search-layout"><input class="input" value="회의" aria-label="검색어"><div class="search-meta"><div class="seg"><span class="on">±1년</span><span>과거</span><span>앞으로</span><span>지정</span><span>전체</span></div><span class="spacer"></span><small>6건</small></div><div class="card results">${[['오늘','팀 프로젝트 회의','09:30'],['09/08','브랜드 회의','14:00'],['09/15','월간 운영 회의','10:00'],['10/02','2.2 회고 회의','16:30'],['11/11','파트너 정기 회의','11:00']].map(x=>`<div class="result"><time>${x[0]}</time><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div></div></div>`}
function timetable(){let rows='';for(let i=1;i<=7;i++)rows+=`<tr><td><b>${i}교시</b><br><small>${8+i}:00</small></td><td>${i==1?'SCM 분석':''}</td><td>${i==2?'영어':''}</td><td>${i==3?'프로젝트':''}</td><td>${i==4?'데이터 실습':''}</td><td>${i==5?'발표 준비':''}</td></tr>`;return `<div class="window">${heading('▦','나의 시간표','<button class="icon">⚙</button>')}<div class="body"><div class="card table-wrap"><table class="tt"><thead><tr><th>시간</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="footer"><small>월–금 · 7교시 · 09:00 시작</small><span class="spacer"></span><button class="btn primary">시간표 저장</button></div></div>`}
function alarm(){return `<div class="window alarm">${heading('◴','알람')}<div class="body"><div class="card alarm-entry"><div class="seg"><span class="on">타이머</span><span>시각 알람</span></div><input class="input" value="25분"><button class="btn primary">시작</button></div><b>실행 중</b><div class="card alarm-list">${[['집중 타이머','24:38','중지'],['회의 알림','오늘 14:00','해제'],['약 챙기기','내일 08:30','해제']].map(x=>`<div class="alarm-row"><b>${x[0]}</b><small>${x[1]}</small><button class="btn">${x[2]}</button></div>`).join('')}</div></div></div>`}
function kbo(){const cells=Array.from({length:28},(_,i)=>`<div class="day"><b>${i+1}</b>${[3,7,12,18,23].includes(i)?'<div class="game">18:30 LG vs 두산</div>':''}</div>`).join('');return `<div class="window kbo">${heading('⚾','KBO 경기 일정','<button class="btn">‹</button><b>2026년 9월</b><button class="btn">›</button><button class="btn">오늘</button><button class="icon">⚙</button>')}<div class="body"><div class="kbo-toolbar"><div class="seg"><span class="on">전체 경기</span><span>응원팀</span></div><span class="spacer"></span><small>최종 갱신 13:42</small></div><div class="card kbo-grid">${cells}</div><div class="footer"><small>선택한 경기 2개</small><span class="spacer"></span><button class="btn">선택 해제</button><button class="btn primary">선택 경기 등록</button></div></div></div>`}
const renderers={main,search,timetable,alarm,kbo};let screen='main',variant='current';
function draw(){screensEl.innerHTML=screens.map(x=>`<button class="${screen==x[0]?'on':''}" data-screen="${x[0]}">${x[1]}</button>`).join('');variantsEl.innerHTML=variants.map(x=>`<button class="${variant==x[0]?'on':''}" data-variant="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join('');preview.className=variant==='current'?'':`v-${variant}`;preview.innerHTML=renderers[screen]();const n=notes[variant];notesEl.innerHTML=`<article class="note ${variant==='a'?'recommend':''}"><h3>${variant==='a'?'추천안 <span class="badge">밀도 우선</span>':'이 안의 판단'}</h3><p>${variant==='a'?'ONHARU가 상시 표시되는 일정 도구라는 점에서 A를 기본 추천합니다. 화면별 선택은 달라도 됩니다.':'현재 화면과 나란히 보며 기능 우선순위를 확인하세요.'}</p></article><article class="note"><h3>${n[0]}</h3><p>${n[1]}</p></article><article class="note"><h3>${n[2]}</h3><p>${n[3]}</p></article>`;}
const screensEl=document.querySelector('#screens'),variantsEl=document.querySelector('#variants'),preview=document.querySelector('#preview'),notesEl=document.querySelector('#notes');document.addEventListener('click',e=>{const s=e.target.closest('[data-screen]'),v=e.target.closest('[data-variant]');if(s)screen=s.dataset.screen;if(v)variant=v.dataset.variant;draw()});draw();
</script>
</body>
</html>
